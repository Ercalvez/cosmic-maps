name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Build dependencies of libcosmic and the map renderer.
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake libxkbcommon-dev libwayland-dev libssl-dev \
            libinput-dev libudev-dev libseat-dev libgbm-dev libdbus-1-dev libfontconfig-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
