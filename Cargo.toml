[package]
name = "cosmic-maps"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Map application for COSMIC Desktop"
repository = "https://github.com/Ercalvez/cosmic-maps"

[dependencies]
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"
tokio = { version = "1.48.0", features = ["full"] }
maplibre = { git = "https://github.com/maplibre/maplibre-rs", package = "maplibre",features = ["headless"] }
# Same version as maplibre uses, to read POIs from the vector tiles it fetches.
geozero = { version = "0.13.0", default-features = false, features = ["with-mvt"] }
# Already used by maplibre; listed to fetch POI details from Nominatim.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
# Already used by maplibre; reads route times and shows them in local time.
jiff = { version = "0.2", features = ["serde"] }
# Logging, filtered with RUST_LOG, as in other COSMIC apps.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # About widget for the app
    "about",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # GPU-accelerated rendering
    "wgpu",
    # XDG portals on Linux, for the user's location
    "xdg-portal",
    # Native Wayland support, as in COSMIC Store and Settings. Without it, clicking
    # a segmented control (the directions' travel modes) selects nothing.
    "wayland",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
